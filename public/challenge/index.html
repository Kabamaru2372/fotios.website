<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picksy Challenge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: block;
    }

    .app-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4A8FE0;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .sender {
      font-size: 17px;
      color: #a0a0b8;
      margin-bottom: 32px;
    }

    .sender strong {
      color: #ffffff;
    }

    .stat-row {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 16px 12px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #4A8FE0;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #6b6b88;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 16px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.06);
      color: #a0a0b8;
      font-size: 14px;
      font-weight: 500;
      border-radius: 14px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-secondary:hover { opacity: 0.7; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 13px;
      color: #6b6b88;
      margin-top: 20px;
      min-height: 20px;
    }

    .privacy {
      font-size: 11px;
      color: #3d3d55;
      margin-top: 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📱</span>
    <div class="app-name">Picksy · Be Present</div>
    <h1 id="title">You've been challenged!</h1>
    <p class="sender" id="subtitle">Opening the app…</p>

    <div class="stat-row" id="stats" style="display:none">
      <div class="stat">
        <div class="stat-value" id="stat-pickups">—</div>
        <div class="stat-label">Pickups today</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-goal">—</div>
        <div class="stat-label">Daily goal</div>
      </div>
    </div>

    <a id="btn-open" class="btn-primary" href="#" style="display:none">
      Open in Picksy
    </a>
    <a id="btn-store" class="btn-secondary" href="https://apps.apple.com/app/id6745155065" style="display:none">
      Download Picksy — it's free
    </a>

    <p class="status" id="status">
      <span class="spinner"></span> Opening Picksy…
    </p>

    <p class="privacy">
      No account required · Anonymous · No personal data shared
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d'); // base64url-encoded JSON payload

    let name = 'A friend';
    let pickups = null;
    let goal = null;

    // Decode the payload if present
    if (d) {
      try {
        // Restore standard base64 from base64url
        const b64 = d.replace(/-/g, '+').replace(/_/g, '/');
        const json = atob(b64);
        const payload = JSON.parse(json);
        name    = payload.name    || 'A friend';
        pickups = payload.weekly  ? payload.weekly[payload.weekly.length - 1] : null;
        goal    = payload.goal    || null;
      } catch (e) {
        console.warn('Could not decode payload', e);
      }
    }

    // Update UI with sender info
    document.getElementById('subtitle').textContent =
      name !== 'A friend' ? `From ${name}` : 'From a friend';

    if (pickups !== null && goal !== null) {
      document.getElementById('stat-pickups').textContent = pickups;
      document.getElementById('stat-goal').textContent    = goal;
      document.getElementById('stats').style.display      = 'flex';
    }

    // Build deep link — same path, same params, just picksy:// scheme
    const deepLink = `picksy://challenge?${params.toString()}`;

    // Set up manual "Open" button
    const btnOpen = document.getElementById('btn-open');
    btnOpen.href = deepLink;

    // Try to open the app
    window.location.href = deepLink;

    // After 1.6s, if still here → app not installed → show App Store button
    setTimeout(() => {
      document.getElementById('status').textContent = '';
      document.getElementById('title').textContent  = 'Get Picksy to accept';
      document.getElementById('subtitle').textContent =
        name !== 'A friend'
          ? `${name} is tracking their phone pickups. Join them.`
          : 'Your friend is tracking their phone pickups. Join them.';

      btnOpen.style.display  = 'block';
      document.getElementById('btn-store').style.display = 'block';
    }, 1600);
  </script>
</body>
</html>
